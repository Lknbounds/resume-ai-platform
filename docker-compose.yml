services:

  mysql:
    image: mysql:8.0
    container_name: jianli-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-resume_ai}
      MYSQL_USER: ${DB_USER:-resume_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - jianli-network

  redis:
    image: redis:7-alpine
    container_name: jianli-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - jianli-network

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    image: jianli-backend:latest
    container_name: jianli-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-resume_ai}
      DB_USER: ${DB_USER:-resume_user}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AI_ENABLED: ${AI_ENABLED:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RESUME_STORAGE_DIR: /app/data/uploads/resumes
    volumes:
      - resume-files:/app/data/uploads/resumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - jianli-network

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    image: jianli-frontend:latest
    container_name: jianli-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jianli-network

volumes:
  mysql-data:
  redis-data:
  resume-files:

networks:
  jianli-network:
    driver: bridge