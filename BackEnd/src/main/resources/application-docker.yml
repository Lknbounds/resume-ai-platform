# 容器内运行：host 用 compose 服务名
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME:resume_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
app:
  cors:
    allowed-origins: http://localhost,http://127.0.0.1
management:
  endpoint:
    health:
      probes:
        enabled: true
